name: YouTube monitor agent

on:
  schedule:
    - cron: "0,30 */1 * * *"
  workflow_dispatch: {}

concurrency:
  group: yt_channel_monitor
  cancel-in-progress: false

permissions:
  contents: write   # the run commits data/yt_seen_ids.json back to the repository

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Without a persisted data/yt_seen_ids.json every run rediscovers the same
      # videos as "new" and pushes them again.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Queued runs and reruns must read the latest persisted receipts.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run YouTube monitor agent
        env:
          TELEGRAM_BOT_TOKEN_02: ${{ secrets.TELEGRAM_BOT_TOKEN_02 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        # Leave five minutes for persistence even when summarization stalls.
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 24m python src/yt_monitor.py
          status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Persist seen video ids
        if: always()
        uses: ./.github/actions/persist-state
        with:
          paths: data/yt_seen_ids.json
          message: "chore(state): update seen YouTube video ids [skip ci]"
