name: Telegram Assistant

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-qa
  cancel-in-progress: true

permissions:
  contents: write   # persist the shared topic list and reading progress

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # data/recent_news.json is committed by flash_monitor.yml, so the checkout
      # already carries the latest context; this job only ever reads it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Telegram Assistant
        env:
          TELEGRAM_BOT_TOKEN_01: ${{ secrets.TELEGRAM_BOT_TOKEN_01 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        # Leave time to save topics and reading progress before the job deadline.
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 350m python src/telegram_assistant.py
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Persist event tracking state
        if: always()
        uses: ./.github/actions/persist-state
        with:
          paths: data/event_tracking.json
          message: "chore(state): save event tracking progress [skip ci]"
