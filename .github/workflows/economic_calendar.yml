name: Daily economic calendar

on:
  push:
    branches: [main]
    paths:
      - 'src/economic_calendar.py'
      - '.github/workflows/economic_calendar.yml'
  schedule:
    # 08:00 Asia/Taipei = 00:00 UTC. GitHub may delay scheduled jobs.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Explicitly resend today's reminder even if already delivered
        type: boolean
        default: false

concurrency:
  group: daily-economic-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Send two-day economic calendar
        env:
          TELEGRAM_BOT_TOKEN_01: ${{ secrets.TELEGRAM_BOT_TOKEN_01 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RESEND: ${{ inputs.force }}
        run: |
          if [ "$FORCE_RESEND" = "true" ]; then
            python src/economic_calendar.py --force
          else
            python src/economic_calendar.py
          fi
      - name: Persist calendar delivery state
        if: always()
        uses: ./.github/actions/persist-state
        with:
          paths: data/economic_calendar_state.json
          message: "chore(state): record economic calendar delivery [skip ci]"
