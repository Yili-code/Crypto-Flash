name: Jin10 flash monitor Agent

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: jin10-monitor
  cancel-in-progress: true

permissions:
  contents: write   # the run commits data/recent_news.json back to the repository

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jin10 Monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RECONNECT_DELAY: '30'
          TELEGRAM_BOT_TOKEN_01: ${{ secrets.TELEGRAM_BOT_TOKEN_01 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/jin10_monitor.py

      # This job is the only writer of data/recent_news.json; telegram_assistant.yml
      # reads it straight out of the checkout.
      - name: Persist recent news context
        if: always()
        continue-on-error: true
        uses: ./.github/actions/persist-state
        with:
          paths: data/recent_news.json
          message: "chore(state): update recent news context [skip ci]"
