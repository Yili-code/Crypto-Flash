name: Jin10 flash monitor Agent

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: jin10-monitor
  cancel-in-progress: false

permissions:
  contents: write   # the run commits data/recent_news.json back to the repository

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run live flash monitor and Telegram Assistant
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_LIVE_DAILY_REQUESTS: ${{ vars.GEMINI_LIVE_DAILY_REQUESTS }}
          GEMINI_POLICY_REVISION: ${{ vars.GEMINI_POLICY_REVISION }}
          GEMINI_RECONNECT_DELAY: '30'
          TELEGRAM_BOT_TOKEN_01: ${{ secrets.TELEGRAM_BOT_TOKEN_01 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_USER_IDS: ${{ secrets.TELEGRAM_OWNER_USER_IDS }}
        # Stop before the job deadline so the archive persistence step can run.
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 350m python src/flash_service.py
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Check persisted live health
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_POLICY_REVISION: ${{ vars.GEMINI_POLICY_REVISION }}
          TELEGRAM_OWNER_USER_IDS: ${{ secrets.TELEGRAM_OWNER_USER_IDS }}
        run: python src/operational_health.py --check live

      # Ingestion and Q&A share live files within this runner.
      - name: Persist recent news context
        if: always()
        uses: ./.github/actions/persist-state
        with:
          paths: data/recent_news.json data/news_archive.json data/event_tracking.json data/gemini_live_usage.json data/feed_seen.json data/monitoring_daily.json data/classification_backlog.json data/telegram_update_state.json
          message: "chore(state): update recent news context [skip ci]"
