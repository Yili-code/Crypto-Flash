name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'data/**'      # the monitors commit their state files back; that is not worth a CI run
      - 'docs/**'
      - 'assets/**'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No secrets are set here on purpose: the suite must never reach the network.
      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
