name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'data/**'      # the monitors commit their state files back; that is not worth a CI run
      - 'docs/**'
      - 'assets/**'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No secrets are set here on purpose: the suite must never reach the network.
      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  founder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private research app
        run: |
          node --check founder/worker.mjs
          node --check founder/public/app.js
          node --test founder/tests/worker.test.mjs
          python -m unittest discover -s founder/tests -p 'test_*.py'
