name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'data/**'      # the monitors commit their state files back; that is not worth a CI run
      - 'docs/**'
      - 'assets/**'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      # No secrets are set here on purpose: the suite must never reach the network.
      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
