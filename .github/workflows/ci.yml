name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'data/**'      # the monitors commit their state files back; that is not worth a CI run
      - 'docs/**'
      - 'assets/**'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      # No secrets are set here on purpose: the suite must never reach the network.
      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
