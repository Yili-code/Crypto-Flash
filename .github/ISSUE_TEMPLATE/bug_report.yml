name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste tokens, chat IDs, private messages, or unredacted production state.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, and which command, workflow, or Telegram action was involved?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect based on the documentation or prior behavior?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: List the smallest safe steps or fixture that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Send or receive ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit SHA, Python version, operating system, and local or GitHub Actions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Include only the relevant lines after removing secrets and personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed tokens, chat IDs, private messages, and other sensitive data.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
