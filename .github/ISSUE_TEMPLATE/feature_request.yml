name: Feature request
description: Propose a focused improvement with a verifiable user outcome.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete monitoring or operating problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not an implementation or marketing claim.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Failure and data boundaries
      description: What should happen when the source, Gemini, Telegram, or state persistence fails?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This request does not depend on invented performance, accuracy, or adoption claims.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
