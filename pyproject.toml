[tool.pytest.ini_options]
# src/ holds flat modules that import each other by bare name (e.g. `from tg import ...`),
# so it has to be on sys.path. testpaths keeps the diagnostic scripts that happen to be
# named src/test_*.py out of collection.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Correctness only (pyflakes + syntax/import errors). Formatting style is left alone.
select = ["E4", "E7", "E9", "F"]
